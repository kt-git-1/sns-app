spring:
  application:
    name: sns-app
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sns_db}
    username: ${POSTGRES_USER:sns_user}
    password: ${POSTGRES_PASSWORD:sns_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  mvc:
    locale: ja_JP
    locale-resolver: accept-header
  jwt:
    secret: ${JWT_SECRET:phdlsjkarxiwbqmtcvefznugoyrpklhf}
    access-exp-minutes: 15
    refresh-exp-days: 14
    issuer: my-sns-app

server:
  port: 8080